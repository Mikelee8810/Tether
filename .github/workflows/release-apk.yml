name: Release APK

on:
  push:
    branches: ['release/v*']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, e.g. 0.1.0'
        required: true
        default: '0.1.0'
      prerelease:
        description: 'Publish as a prerelease'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)          VERSION="${GITHUB_REF_NAME#v}" ;;
            refs/heads/release/*) VERSION="${GITHUB_REF_NAME#release/}"; VERSION="${VERSION#v}" ;;
            *)                    VERSION="${INPUT_VERSION#v}" ;;
          esac
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must look like 0.1.0, got '$VERSION'."
            exit 1
          fi
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          {
            echo "VERSION=$VERSION"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "TAG=v$VERSION"
            echo "APK_NAME=Tether-$VERSION.apk"
          } >> "$GITHUB_ENV"

      - name: Require release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.TETHER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TETHER_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Tether release signing secrets are not configured."
            exit 1
          fi

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Use a newer version."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TETHER_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/tether-release.jks"
          test -s "$RUNNER_TEMP/tether-release.jks"

      - name: Build signed release APK
        env:
          TETHER_KEYSTORE_FILE: ${{ runner.temp }}/tether-release.jks
          TETHER_KEYSTORE_PASSWORD: ${{ secrets.TETHER_KEYSTORE_PASSWORD }}
          TETHER_VERSION_NAME: ${{ env.VERSION }}
          TETHER_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify signer and stage APK
        env:
          EXPECTED_SIGNER_SHA256: '9A:07:3F:99:BA:C5:AA:E5:1D:3F:BF:4D:EA:9A:06:7F:D3:09:C4:38:43:87:4C:D7:05:59:FB:FA:E7:45:CC:23'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BUILT="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          if [ -z "$APKSIGNER" ] || [ -z "$BUILT" ]; then
            echo "::error::Could not locate apksigner or the release APK."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$BUILT" | tee signer.txt
          EXPECTED="$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          ACTUAL="$(grep -iEo 'SHA-256 digest: *[0-9a-f]{64}' signer.txt | head -1 | grep -Eo '[0-9a-f]{64}')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signer does not match the Tether release key."
            exit 1
          fi
          mkdir -p dist
          cp "$BUILT" "dist/$APK_NAME"

      - name: Checksum APK
        working-directory: dist
        run: |
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          echo "APK_SHA256=$(cut -d' ' -f1 < "$APK_NAME.sha256")" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          {
            echo "Tether ${VERSION} Android build."
            echo
            echo "Built and signed by GitHub Actions from \`${GITHUB_SHA}\`."
            echo
            echo "- versionName ${VERSION}"
            echo "- versionCode ${VERSION_CODE}"
            echo "- SHA-256: \`${APK_SHA256}\`"
            echo
            echo "Download \`${APK_NAME}\` under Assets to install or track it with ObtainX."
          } > dist/notes.md
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Tether ${VERSION}" \
            --notes-file dist/notes.md \
            $FLAGS \
            "dist/$APK_NAME" "dist/$APK_NAME.sha256"

      - name: Verify published APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p readback
          gh release download "$TAG" --pattern "$APK_NAME" --dir readback
          DOWNLOADED="$(sha256sum "readback/$APK_NAME" | cut -d' ' -f1)"
          if [ "$DOWNLOADED" != "$APK_SHA256" ]; then
            echo "::error::Published APK checksum does not match the build output."
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### Tether ${VERSION} published"
            echo
            echo "- Tag: \`$TAG\`"
            echo "- APK: \`$APK_NAME\`"
            echo "- SHA-256: \`$APK_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
