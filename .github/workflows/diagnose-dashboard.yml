name: Diagnose missing-contact-photo crash

on:
  push:
    branches: ['diagnostic/startup-crash-v0.1.0']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/startup-crash-v0.1.0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Inject one imported contact with no photo
        run: |
          python3 - <<'PY'
          from pathlib import Path

          nav = Path('app/src/main/java/com/relationshipradar/app/ui/RadarNavHost.kt')
          s = nav.read_text()
          old = 'if (!settings.onboardingDone && !onboardingSeen) {'
          new = 'if (false && !settings.onboardingDone && !onboardingSeen) {'
          if old not in s:
              raise SystemExit('Onboarding gate not found')
          nav.write_text(s.replace(old, new, 1))

          app = Path('app/src/main/java/com/relationshipradar/app/RadarApp.kt')
          s = app.read_text()
          old = 'scope.launch { repo.seedCategoriesIfEmpty() }'
          new = '''scope.launch {
            repo.seedCategoriesIfEmpty()
            val diagnosticId = repo.createPerson("Photo-less contact")
            repo.getPerson(diagnosticId)?.let {
                repo.updatePerson(it.copy(avatar = "photo", contactLookupKey = "diagnostic-missing-contact"))
            }
        }'''
          if old not in s:
              raise SystemExit('RadarApp seed hook not found')
          app.write_text(s.replace(old, new, 1))

          p = Path('third_party/whisper.cpp/examples/whisper.android/lib/build.gradle')
          s = p.read_text()
          old = "abiFilters 'arm64-v8a'"
          new = "abiFilters 'arm64-v8a', 'x86_64'"
          if old not in s:
              raise SystemExit('Expected Whisper ABI filter not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build diagnostic APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Locate APK
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -f "$APK"
          echo "APK=$GITHUB_WORKSPACE/$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch dashboard and capture missing-photo failure
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            bash -lc 'set +e; PAGE="$(adb shell getconf PAGE_SIZE | tr -d "\r")"; echo "page_size=$PAGE"; adb install -r "$APK" > "$RUNNER_TEMP/photo-install.txt" 2>&1; INSTALL=$?; cat "$RUNNER_TEMP/photo-install.txt"; adb shell pm grant com.relationshipradar.app android.permission.READ_CONTACTS 2>&1 || true; adb logcat -c; adb shell am force-stop com.relationshipradar.app; adb shell am start -W -n com.relationshipradar.app/.MainActivity > "$RUNNER_TEMP/photo-start.txt" 2>&1; START=$?; cat "$RUNNER_TEMP/photo-start.txt"; sleep 15; PID="$(adb shell pidof com.relationshipradar.app | tr -d "\r")"; echo "install=$INSTALL start=$START pid=$PID"; echo "=== CRASH BUFFER ==="; adb logcat -d -b crash -v threadtime || true; echo "=== AndroidRuntime ==="; adb logcat -d -v threadtime AndroidRuntime:E "*:S" || true; echo "=== Contact photo / Tether lines ==="; adb logcat -d -v threadtime | grep -E "relationshipradar|FATAL EXCEPTION|AndroidRuntime|ConcurrentHashMap|NullPointerException|ContactPhotos|produceState|Coroutine|Room|SQLite" | tail -n 1400 || true; if [ "$INSTALL" -ne 0 ]; then exit 2; fi; if [ -z "$PID" ]; then exit 3; fi; exit "$START"'
