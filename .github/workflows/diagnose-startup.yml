name: Diagnose startup crash

on:
  push:
    branches: ['diagnostic/startup-crash-v0.1.0']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TETHER_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/tether-release.jks"
          test -s "$RUNNER_TEMP/tether-release.jks"

      - name: Add x86_64 only for emulator diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('third_party/whisper.cpp/examples/whisper.android/lib/build.gradle')
          s = p.read_text()
          old = "abiFilters 'arm64-v8a'"
          new = "abiFilters 'arm64-v8a', 'x86_64'"
          if old not in s:
              raise SystemExit('Expected ABI filter not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build signed diagnostic release
        env:
          TETHER_KEYSTORE_FILE: ${{ runner.temp }}/tether-release.jks
          TETHER_KEYSTORE_PASSWORD: ${{ secrets.TETHER_KEYSTORE_PASSWORD }}
          TETHER_VERSION_NAME: 0.1.0-diagnostic
          TETHER_VERSION_CODE: 101
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Inspect APK and native alignment
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "=== APK ==="
          ls -lh "$APK"
          echo "=== Native ABIs ==="
          unzip -l "$APK" | grep -E 'lib/.+\.so$' | awk '{print $4}' | sed 's#^lib/##' | cut -d/ -f1 | sort -u
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          echo "=== 16 KB ZIP alignment ==="
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          rm -rf "$RUNNER_TEMP/native" && mkdir -p "$RUNNER_TEMP/native"
          unzip -q "$APK" 'lib/arm64-v8a/*.so' -d "$RUNNER_TEMP/native"
          READELF="$(find "$ANDROID_HOME/ndk" -type f -name llvm-readelf | head -1)"
          echo "=== ARM64 ELF LOAD alignment ==="
          for so in "$RUNNER_TEMP"/native/lib/arm64-v8a/*.so; do
            echo "--- $so"
            "$READELF" -lW "$so" | grep LOAD || true
          done

      - name: Install Android 16 emulator image
        run: |
          sudo chmod 666 /dev/kvm || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' \
            'emulator' \
            'system-images;android-36;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name tether_startup \
            --package 'system-images;android-36;google_apis;x86_64'

      - name: Boot emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd tether_startup -no-window -no-audio -no-snapshot -no-boot-anim \
            -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell input keyevent 82 || true

      - name: Launch Tether and capture crash
        run: |
          set +e
          adb install -r "$APK"
          INSTALL=$?
          echo "install_exit=$INSTALL"
          adb logcat -c
          adb shell am force-stop com.relationshipradar.app
          adb shell am start -W -n com.relationshipradar.app/.MainActivity | tee "$RUNNER_TEMP/am-start.txt"
          START=$?
          sleep 6
          PID="$(adb shell pidof com.relationshipradar.app | tr -d '\r')"
          echo "pid=$PID"
          echo "=== CRASH BUFFER ==="
          adb logcat -d -b crash -v threadtime || true
          echo "=== AndroidRuntime ==="
          adb logcat -d -v threadtime AndroidRuntime:E '*:S' || true
          echo "=== Tether process lines ==="
          adb logcat -d -v threadtime | grep -E 'relationshipradar|FATAL EXCEPTION|AndroidRuntime|Process: com.relationshipradar.app' | tail -n 500 || true
          echo "=== Emulator tail ==="
          tail -n 200 "$RUNNER_TEMP/emulator.log" || true
          if [ "$INSTALL" -ne 0 ] || [ -z "$PID" ]; then
            exit 1
          fi
          exit "$START"
