name: Diagnose startup crash

on:
  push:
    branches: ['diagnostic/startup-crash-v0.1.0']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TETHER_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/tether-release.jks"
          test -s "$RUNNER_TEMP/tether-release.jks"

      - name: Prepare missing-photo crash test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('third_party/whisper.cpp/examples/whisper.android/lib/build.gradle')
          s = p.read_text()
          old = "abiFilters 'arm64-v8a'"
          new = "abiFilters 'arm64-v8a', 'x86_64'"
          if old not in s:
              raise SystemExit('Expected ABI filter not found')
          p.write_text(s.replace(old, new, 1))

          nav = Path('app/src/main/java/com/relationshipradar/app/ui/RadarNavHost.kt')
          s = nav.read_text()
          old = 'if (!settings.onboardingDone && !onboardingSeen) {'
          new = 'if (false && !settings.onboardingDone && !onboardingSeen) {'
          if old not in s:
              raise SystemExit('Onboarding gate not found')
          nav.write_text(s.replace(old, new, 1))

          app = Path('app/src/main/java/com/relationshipradar/app/RadarApp.kt')
          s = app.read_text()
          old = 'scope.launch { repo.seedCategoriesIfEmpty() }'
          new = 'scope.launch {\n            repo.seedCategoriesIfEmpty()\n            val diagnosticId = repo.createPerson("Photo-less contact")\n            repo.getPerson(diagnosticId)?.let {\n                repo.updatePerson(it.copy(avatar = "photo", contactLookupKey = "diagnostic-missing-contact"))\n            }\n        }'
          if old not in s:
              raise SystemExit('RadarApp seed hook not found')
          app.write_text(s.replace(old, new, 1))
          PY

      - name: Build signed diagnostic release
        env:
          TETHER_KEYSTORE_FILE: ${{ runner.temp }}/tether-release.jks
          TETHER_KEYSTORE_PASSWORD: ${{ secrets.TETHER_KEYSTORE_PASSWORD }}
          TETHER_VERSION_NAME: 0.1.0-diagnostic
          TETHER_VERSION_CODE: 101
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Locate APK
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$APK"
          echo "APK=$GITHUB_WORKSPACE/$APK" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch dashboard with missing contact photo
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            adb install -r "$APK"
            adb shell pm grant com.relationshipradar.app android.permission.READ_CONTACTS 2>/dev/null || true
            adb logcat -c
            adb shell am force-stop com.relationshipradar.app
            adb shell am start -W -n com.relationshipradar.app/.MainActivity
            sleep 15
            PID="$(adb shell pidof com.relationshipradar.app | tr -d '\r')"
            echo "pid=$PID"
            echo '=== CRASH BUFFER ==='
            adb logcat -d -b crash -v threadtime || true
            echo '=== CONTACT PHOTO LINES ==='
            adb logcat -d -v threadtime | grep -E 'relationshipradar|FATAL EXCEPTION|AndroidRuntime|NullPointerException|ConcurrentHashMap|ContactPhotos|produceState' | tail -n 1200 || true
            test -n "$PID"
