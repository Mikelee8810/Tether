name: Diagnose startup crash

on:
  push:
    branches: ['diagnostic/startup-crash-v0.1.0']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TETHER_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/tether-release.jks"
          test -s "$RUNNER_TEMP/tether-release.jks"

      - name: Add x86_64 only for emulator diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('third_party/whisper.cpp/examples/whisper.android/lib/build.gradle')
          s = p.read_text()
          old = "abiFilters 'arm64-v8a'"
          new = "abiFilters 'arm64-v8a', 'x86_64'"
          if old not in s:
              raise SystemExit('Expected ABI filter not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build signed diagnostic release
        env:
          TETHER_KEYSTORE_FILE: ${{ runner.temp }}/tether-release.jks
          TETHER_KEYSTORE_PASSWORD: ${{ secrets.TETHER_KEYSTORE_PASSWORD }}
          TETHER_VERSION_NAME: 0.1.0-diagnostic
          TETHER_VERSION_CODE: 101
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Inspect APK and native alignment
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "=== APK ==="
          ls -lh "$APK"
          echo "=== Native ABIs ==="
          unzip -l "$APK" | grep -E 'lib/.+\.so$' | awk '{print $4}' | sed 's#^lib/##' | cut -d/ -f1 | sort -u
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          echo "=== 16 KB ZIP alignment ==="
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch Tether and capture crash
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set +e
            adb install -r "$APK" > "$RUNNER_TEMP/install.txt" 2>&1
            INSTALL=$?
            cat "$RUNNER_TEMP/install.txt"
            echo "install_exit=$INSTALL"
            adb logcat -c
            adb shell am force-stop com.relationshipradar.app
            adb shell am start -W -n com.relationshipradar.app/.MainActivity > "$RUNNER_TEMP/am-start.txt" 2>&1
            START=$?
            cat "$RUNNER_TEMP/am-start.txt"
            sleep 8
            PID="$(adb shell pidof com.relationshipradar.app | tr -d '\r')"
            echo "pid=$PID"
            echo "=== CRASH BUFFER ==="
            adb logcat -d -b crash -v threadtime || true
            echo "=== AndroidRuntime ==="
            adb logcat -d -v threadtime AndroidRuntime:E '*:S' || true
            echo "=== Tether process lines ==="
            adb logcat -d -v threadtime | grep -E 'relationshipradar|FATAL EXCEPTION|AndroidRuntime|Process: com.relationshipradar.app|UnsatisfiedLinkError|Room|IllegalStateException|SecurityException' | tail -n 800 || true
            if [ "$INSTALL" -ne 0 ]; then exit 2; fi
            if [ -z "$PID" ]; then exit 3; fi
            exit "$START"
